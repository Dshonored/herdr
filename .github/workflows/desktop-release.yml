name: Desktop release

# Builds the desktop app (`herdr gui`, `--features gui`) for each platform.
# Pushing a `desktop-v<semver>` tag publishes a GitHub Release that the app's updater reads.
# Running it by hand builds the same artifacts without publishing.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: version embedded in a test build (no release is published)
        required: true
        default: 0.0.0

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: desktop version must look like 1.2.3, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: herdr-desktop-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: herdr-desktop-macos-aarch64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: herdr-desktop-macos-x86_64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: herdr-desktop-windows-x86_64.zip
    env:
      HERDR_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
      HERDR_DESKTOP_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libzstd-dev libssl-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}

      - name: Package (Linux app)
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          dir=herdr-desktop
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/herdr" "$dir/herdr"
          cp packaging/desktop/linux/install.sh packaging/desktop/linux/herdr-desktop.desktop.in "$dir/"
          cp assets/logo.png "$dir/herdr-desktop.png"
          chmod 755 "$dir/herdr" "$dir/install.sh"
          desktop-file-validate "$dir/herdr-desktop.desktop.in" || true
          tar -czf "$ASSET" "$dir"

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          app=herdr.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/herdr" "$app/Contents/MacOS/herdr"
          # Finder starts the bundle without arguments; the launcher opens the desktop app.
          printf '#!/bin/sh\nexec "$(dirname "$0")/herdr" gui "$@"\n' > "$app/Contents/MacOS/herdr-desktop"
          chmod 755 "$app/Contents/MacOS/herdr-desktop" "$app/Contents/MacOS/herdr"

          iconset=herdr.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/herdr.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>herdr</string>
            <key>CFBundleDisplayName</key><string>herdr</string>
            <key>CFBundleIdentifier</key><string>io.github.dshonored.herdr-desktop</string>
            <key>CFBundleExecutable</key><string>herdr-desktop</string>
            <key>CFBundleIconFile</key><string>herdr</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${HERDR_DESKTOP_VERSION}</string>
            <key>CFBundleVersion</key><string>${HERDR_DESKTOP_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          # Unsigned builds still need an ad-hoc signature over the whole bundle.
          codesign --force --deep --sign - "$app"
          # The zip is what installed copies update from.
          ditto -c -k --keepParent "$app" "$ASSET"

          # The installer puts herdr.app in /Applications. Opening an app straight from
          # Downloads makes macOS run a read-only translocated copy that can't update itself
          # and vanishes under the local server it started.
          pkgroot=pkgroot
          mkdir -p "$pkgroot"
          ditto "$app" "$pkgroot/herdr.app"
          pkgbuild --analyze --root "$pkgroot" component.plist
          # Not relocatable: always install to /Applications, never over a copy elsewhere.
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          pkgbuild --root "$pkgroot" --component-plist component.plist \
            --install-location /Applications \
            --scripts packaging/desktop/macos/scripts \
            --identifier io.github.dshonored.herdr-desktop \
            --version "$HERDR_DESKTOP_VERSION" \
            "${ASSET%.zip}.pkg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-desktop-windows-x86_64"
          # Stages and verifies herdr.exe with its ConPTY runtime; that script's own zip
          # has a fixed layout, so the desktop zip is rebuilt below with the launcher added.
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath (Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg") `
            -StageDir $stage `
            -OutputPath (Join-Path $env:RUNNER_TEMP "herdr-cli.zip")

          # herdr.exe is a console program; shortcuts open this windowless launcher instead.
          cargo build --release --locked -p herdr-desktop-launcher --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          Copy-Item target\${{ matrix.target }}\release\herdr-desktop.exe $stage

          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets/logo.png').save(r'$stage\herdr.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if ($LASTEXITCODE -ne 0) { throw "icon conversion failed" }

          # The zip is what installed copies update from.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f ${{ matrix.asset }} -C $stage .
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          $env:HERDR_STAGE_DIR = $stage
          & $iscc packaging\desktop\windows\herdr.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Move-Item packaging\desktop\windows\herdr-desktop-windows-x86_64-setup.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            herdr-desktop-*.pkg
            herdr-desktop-*-setup.exe
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum herdr-desktop-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: dist
        run: |
          cat > notes.md <<EOF
          herdr desktop $VERSION.

          | Platform | Download |
          | --- | --- |
          | Windows x86_64 | \`herdr-desktop-windows-x86_64-setup.exe\` (run it; herdr appears in the Start menu) |
          | macOS Apple Silicon | \`herdr-desktop-macos-aarch64.pkg\` (open and install; herdr appears in Applications) |
          | macOS Intel | \`herdr-desktop-macos-x86_64.pkg\` (open and install; herdr appears in Applications) |
          | Linux x86_64 | \`herdr-desktop-linux-x86_64.tar.gz\` (extract, run \`./herdr-desktop/install.sh\`, then open herdr from your app menu) |

          The macOS and Windows \`.zip\` files are what installed copies update from; install with the \`.pkg\` or \`setup.exe\`.
          Builds are unsigned: on macOS right-click the .pkg → Open the first time (or System Settings → Privacy & Security → Open Anyway); on Windows choose "Run anyway".
          Installed copies update themselves from this page (Settings → Updates).
          EOF
          gh release create "$GITHUB_REF_NAME" herdr-desktop-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "herdr desktop $VERSION" \
            --notes-file notes.md \
            --generate-notes
